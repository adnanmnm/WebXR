<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Test</title>

  <!-- model-viewer -->
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      background: #f4f4f4;
    }

    model-viewer {
      width: 100%;
      height: 80vh;
      background: #fff;
    }

    button {
      padding: 12px 20px;
      margin: 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: black;
      color: white;
    }
  </style>
</head>
<body>

<h2>AR Working Test</h2>

<model-viewer
  id="mv"
  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
  alt="3D Model"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  exposure="1"
  environment-image="neutral">
</model-viewer>

<button onclick="openAR()">Open AR</button>

<script>
function openAR() {
  const mv = document.getElementById("mv");

  if (mv.canActivateAR) {
    mv.activateAR();
  } else {
    alert("AR not supported OR model issue");
    console.log("AR supported:", mv.canActivateAR);
  }
}
</script>

</body>
</html>
