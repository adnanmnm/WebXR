<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Walking Robot</title>

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; }
    #panel {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px;
      border-radius: 10px;
    }
    button {
      margin: 4px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    #msg { margin-top: 8px; font-size: 13px; color: #ffd966; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>

<div id="panel">
  <b>Robot Animation Demo</b><br>
  <button onclick="playAnimation('Idle')">Idle</button>
  <button onclick="playAnimation('Walking')">Walk</button>
  <button onclick="playAnimation('Running')">Run</button>
  <button onclick="playAnimation('Dance')">Dance</button>
  <div id="msg">Loading robot...</div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

let scene, camera, renderer, controls;
let mixer, robot, currentAction;
let actions = {};
const clock = new THREE.Clock();

const msg = document.getElementById("msg");

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfd1e5);

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 3, 9);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.5, 0);
  controls.enableDamping = true;
  controls.update();

  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.4);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  scene.add(dirLight);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({ color: 0x666666 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  scene.add(new THREE.GridHelper(30, 30));

  const loader = new GLTFLoader();

  loader.load(
    "https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb",
    function (gltf) {
      robot = gltf.scene;
      robot.scale.set(0.45, 0.45, 0.45);
      robot.position.set(0, 0, 0);

      robot.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(robot);

      mixer = new THREE.AnimationMixer(robot);

      gltf.animations.forEach((clip) => {
        actions[clip.name] = mixer.clipAction(clip);
      });

      msg.innerHTML = "Robot loaded ✅";
      console.log("Animations:", Object.keys(actions));

      playAnimation("Walking");
    },
    function (xhr) {
      if (xhr.total) {
        msg.innerHTML = "Loading: " + Math.round((xhr.loaded / xhr.total) * 100) + "%";
      }
    },
    function (error) {
      console.error(error);
      msg.innerHTML = "Failed to load robot ❌ Check Console";
    }
  );

  window.addEventListener("resize", resize);
}

window.playAnimation = function(name) {
  if (!actions[name]) {
    msg.innerHTML = "Animation not found: " + name;
    return;
  }

  const nextAction = actions[name];

  if (currentAction && currentAction !== nextAction) {
    currentAction.fadeOut(0.3);
  }

  nextAction.reset().fadeIn(0.3).play();
  currentAction = nextAction;

  msg.innerHTML = "Playing: " + name;
};

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);

  if (robot && currentAction) {
    if (currentAction === actions["Walking"]) {
      robot.position.z += 0.015;
    }

    if (currentAction === actions["Running"]) {
      robot.position.z += 0.045;
    }

    if (robot.position.z > 8) {
      robot.position.z = -8;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
