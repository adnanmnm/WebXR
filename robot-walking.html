<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Walking Robot - Three.js</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
    }

    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,0.65);
      padding: 12px 16px;
      border-radius: 10px;
      z-index: 10;
    }

    button {
      margin: 4px;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="info">
  <h3>Robot GLB Animation Demo</h3>
  <button onclick="playAnimation('Idle')">Idle</button>
  <button onclick="playAnimation('Walking')">Walk</button>
  <button onclick="playAnimation('Running')">Run</button>
  <button onclick="playAnimation('Dance')">Dance</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/controls/OrbitControls.js";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/loaders/GLTFLoader.js";

let scene, camera, renderer, controls;
let mixer, robot, currentAction;
let actions = {};
let clock = new THREE.Clock();

init();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xbfd1e5);

  camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );
  camera.position.set(0, 3, 9);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.5, 0);
  controls.update();

  // Light
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
  hemiLight.position.set(0, 20, 0);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(5, 10, 7);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Grid
  const grid = new THREE.GridHelper(30, 30);
  scene.add(grid);

  // Load Robot
  const loader = new GLTFLoader();

  loader.load(
    "https://rawcdn.githack.com/mrdoob/three.js/36f9f34752a985359e2556c68a52234436cefdfa/examples/models/gltf/RobotExpressive/RobotExpressive.glb",
    function (gltf) {
      robot = gltf.scene;
      robot.scale.set(0.45, 0.45, 0.45);
      robot.position.set(0, 0, 0);

      robot.traverse(function (child) {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(robot);

      mixer = new THREE.AnimationMixer(robot);

      gltf.animations.forEach((clip) => {
        actions[clip.name] = mixer.clipAction(clip);
      });

      console.log("Available animations:", Object.keys(actions));

      playAnimation("Walking");
    },
    undefined,
    function (error) {
      console.error("Error loading robot:", error);
      alert("Robot model failed to load. Use Live Server or check internet connection.");
    }
  );

  window.addEventListener("resize", onWindowResize);
}

window.playAnimation = function (name) {
  if (!actions[name]) {
    console.warn("Animation not found:", name);
    return;
  }

  const nextAction = actions[name];

  if (currentAction && currentAction !== nextAction) {
    currentAction.fadeOut(0.4);
  }

  nextAction.reset().fadeIn(0.4).play();
  currentAction = nextAction;
};

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (mixer) {
    mixer.update(delta);
  }

  // حركة أمامية فقط عند Walking أو Running
  if (robot && currentAction) {
    if (currentAction === actions["Walking"]) {
      robot.position.z += 0.015;
    }

    if (currentAction === actions["Running"]) {
      robot.position.z += 0.045;
    }

    // يرجع للبداية حتى لا يخرج من المشهد
    if (robot.position.z > 8) {
      robot.position.z = -8;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
