<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three.js AR Robot</title>

<style>
  body { margin:0; overflow:hidden; }
  button {
    position: absolute;
    bottom: 20px;
    left: 20px;
    padding: 12px;
    z-index: 10;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>

</head>

<body>

<button id="arBtn">Start AR</button>

<script type="module">
import * as THREE from "three";
import { ARButton } from "three/addons/webxr/ARButton.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

let camera, scene, renderer;
let robot, mixer;
const clock = new THREE.Clock();

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera();

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // AR Button
  document.body.appendChild(ARButton.createButton(renderer));

  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  // Load model
  const loader = new GLTFLoader();

  loader.load("RobotExpressive.glb", (gltf) => {

    robot = gltf.scene;
    robot.scale.set(0.3,0.3,0.3);
    robot.position.set(0,0,-2);

    scene.add(robot);

    mixer = new THREE.AnimationMixer(robot);

    const walk = THREE.AnimationClip.findByName(gltf.animations, "Walking");
    mixer.clipAction(walk).play();

  });

  renderer.setAnimationLoop(render);
}

function render() {
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  renderer.render(scene, camera);
}
</script>

</body>
</html>
